<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма</title>
    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <form class="form">
        <fieldset class="fieldset">
            <legend class="title">Ваши личные данные</legend>
            <label class="label">
                <div>Ваше имя</div>
                <input class="input" type="text" placeholder="Имя" name="name" required>
            </label>
            <label class="label">
                <div>Ваш возраст</div>
                <input class="input" type="number" placeholder="Возраст" name="age" required>
            </label>
            <label class="label">
                <div>Ваш номер телефона</div>
                <input class="input" type="tel" inputmode="tel" placeholder="Имя" name="phone-number" required>
            </label>
            <label class="label">
                <div>Ваша почта</div>
                <input class="input" type="email" inputmode="email" placeholder="Имя" name="email" required>
            </label>
        </fieldset>
        <fieldset class="fieldset">
            <label class="label">
                <div>Сообщение</div>
                <textarea class="textarea" name="massage" required></textarea>
            </label>
            <label class="label checkbox-lable">
                <input class="checkbox" type="checkbox" value="acseption" name="acseption" required>
                
                Я принимаю правила
            </label>
        </fieldset>

        </fieldset>
        <button class="button" type="submit">Отправить</button>
    </form>


</body>

</html>
